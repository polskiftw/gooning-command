name: Atomic Generation Scan Once

on:
  push:
    branches:
      - deduper-cache-foundation
    paths:
      - "tools/atomic_generation_scan_once.py"
      - ".github/workflows/atomic-generation-scan-once.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/atomic_generation_scan_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/atomic-generation-scan-once.yml tools/atomic_generation_scan_once.py
          git add deduper/smart_app.py tests/test_atomic_generation_scan_architecture.py
          git commit -m "Promote scans as atomic generations"
          git push origin HEAD:deduper-cache-foundation
