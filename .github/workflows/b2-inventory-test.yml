name: B2 Connection Test + Frozen R2 Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gparty-b2-inventory-test
  cancel-in-progress: false

jobs:
  inventory-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      B2_BUCKET_NAME: gooning-party-media-b2
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install inventory dependency
        run: python -m pip install --disable-pip-version-check "boto3==1.40.1"

      - name: Validate required settings
        shell: bash
        run: |
          set -euo pipefail
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME B2_KEY_ID B2_APPLICATION_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Required secret ${name} is missing."
              exit 1
            fi
          done
          echo "All required settings are present."

      - name: Create definitive read-only R2 inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p migration-inventory

          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          from pathlib import Path

          import boto3
          from botocore.config import Config

          account_id = os.environ["R2_ACCOUNT_ID"]
          bucket = os.environ["R2_BUCKET_NAME"]
          output_dir = Path("migration-inventory")
          inventory_path = output_dir / "r2-frozen-inventory.jsonl"
          summary_path = output_dir / "r2-frozen-inventory-summary.json"

          client = boto3.client(
              "s3",
              endpoint_url=f"https://{account_id}.r2.cloudflarestorage.com",
              aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
              region_name="auto",
              config=Config(signature_version="s3v4", retries={"max_attempts": 10, "mode": "standard"}),
          )

          count = 0
          total_bytes = 0
          digest = hashlib.sha256()
          paginator = client.get_paginator("list_objects_v2")

          with inventory_path.open("wb") as output:
              for page in paginator.paginate(Bucket=bucket, PaginationConfig={"PageSize": 1000}):
                  for item in page.get("Contents", []):
                      record = {
                          "key": item["Key"],
                          "size": int(item["Size"]),
                          "last_modified": item["LastModified"].astimezone(dt.timezone.utc).isoformat(),
                          "etag": item.get("ETag", "").strip('"'),
                      }
                      line = (json.dumps(record, ensure_ascii=False, separators=(",", ":")) + "\n").encode("utf-8")
                      output.write(line)
                      digest.update(line)
                      count += 1
                      total_bytes += record["size"]

          summary = {
              "source": "Cloudflare R2",
              "bucket": bucket,
              "created_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "object_count": count,
              "total_bytes": total_bytes,
              "inventory_sha256": digest.hexdigest(),
              "inventory_file": inventory_path.name,
          }
          summary_path.write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as report:
              report.write("## Frozen R2 inventory\n\n")
              report.write(f"- Objects: **{count:,}**\n")
              report.write(f"- Bytes: **{total_bytes:,}**\n")
              report.write(f"- Inventory SHA-256: `{digest.hexdigest()}`\n")

          print(f"Inventoried {count:,} objects totaling {total_bytes:,} bytes.")
          print(f"Inventory SHA-256: {digest.hexdigest()}")
          PY

      - name: Test restricted B2 connection and clean up test object
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          bucket_name = os.environ["B2_BUCKET_NAME"]
          key_id = os.environ["B2_KEY_ID"]
          application_key = os.environ["B2_APPLICATION_KEY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          run_attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          test_name = f"__gparty_migration_test__/github-run-{run_id}-{run_attempt}.txt"
          payload = b"GParty B2 connection test. Safe to delete.\n"
          sha1 = hashlib.sha1(payload).hexdigest()

          def json_request(url, *, token=None, data=None, headers=None):
              request_headers = dict(headers or {})
              if token:
                  request_headers["Authorization"] = token
              body = None if data is None else json.dumps(data).encode("utf-8")
              if body is not None:
                  request_headers["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=body, headers=request_headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          basic = base64.b64encode(f"{key_id}:{application_key}".encode("utf-8")).decode("ascii")
          auth = json_request(
              "https://api.backblazeb2.com/b2api/v2/b2_authorize_account",
              headers={"Authorization": f"Basic {basic}"},
          )
          api_url = auth["apiUrl"]
          download_url = auth["downloadUrl"]
          token = auth["authorizationToken"]
          allowed = auth.get("allowed", {})

          if allowed.get("bucketName") != bucket_name or not allowed.get("bucketId"):
              raise RuntimeError(
                  f"B2 key is not restricted to expected bucket {bucket_name!r}; "
                  f"reported bucket was {allowed.get('bucketName')!r}."
              )

          required = {"listFiles", "readFiles", "writeFiles", "deleteFiles"}
          capabilities = set(allowed.get("capabilities", []))
          missing = sorted(required - capabilities)
          if missing:
              raise RuntimeError(f"B2 key lacks required capabilities: {', '.join(missing)}")

          bucket_id = allowed["bucketId"]
          uploaded = None
          cleanup_error = None
          try:
              upload_details = json_request(
                  f"{api_url}/b2api/v2/b2_get_upload_url",
                  token=token,
                  data={"bucketId": bucket_id},
              )
              encoded_name = urllib.parse.quote(test_name, safe="/")
              request = urllib.request.Request(
                  upload_details["uploadUrl"],
                  data=payload,
                  headers={
                      "Authorization": upload_details["authorizationToken"],
                      "X-Bz-File-Name": encoded_name,
                      "Content-Type": "text/plain",
                      "Content-Length": str(len(payload)),
                      "X-Bz-Content-Sha1": sha1,
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  uploaded = json.load(response)

              if uploaded.get("fileName") != test_name:
                  raise RuntimeError("B2 returned an unexpected test-object name.")
              if int(uploaded.get("contentLength", -1)) != len(payload):
                  raise RuntimeError("B2 returned an unexpected test-object size.")
              if uploaded.get("contentSha1") != sha1:
                  raise RuntimeError("B2 returned an unexpected test-object checksum.")

              query = urllib.parse.urlencode({"fileId": uploaded["fileId"]})
              request = urllib.request.Request(
                  f"{download_url}/b2api/v2/b2_download_file_by_id?{query}",
                  headers={"Authorization": token},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  downloaded = response.read()
              if downloaded != payload:
                  raise RuntimeError("Downloaded B2 test content did not match the uploaded content.")

              print("B2 upload and byte-for-byte download verification succeeded.")
          finally:
              if uploaded and uploaded.get("fileId"):
                  try:
                      json_request(
                          f"{api_url}/b2api/v2/b2_delete_file_version",
                          token=token,
                          data={"fileName": test_name, "fileId": uploaded["fileId"]},
                      )
                      print("B2 test object was deleted successfully.")
                  except Exception as error:
                      cleanup_error = error

          if cleanup_error:
              raise RuntimeError(f"B2 test object cleanup failed: {cleanup_error}")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as report:
              report.write("\n## B2 connection test\n\n")
              report.write(f"- Restricted bucket: **{bucket_name}**\n")
              report.write("- Upload: **passed**\n")
              report.write("- Byte-for-byte download: **passed**\n")
              report.write("- Test-object cleanup: **passed**\n")
          PY

      - name: Upload frozen inventory artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gparty-r2-frozen-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: migration-inventory/
          if-no-files-found: error
          retention-days: 90

      - name: State the safety boundary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "## Safety boundary"
            echo ""
            echo "This workflow listed R2 objects but did not copy, overwrite, or delete any R2 object."
            echo "It did not migrate the library, modify Yoink, or change the live Worker."
          } >> "$GITHUB_STEP_SUMMARY"
