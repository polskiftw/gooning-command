name: Build Custom FFmpeg 22
run-name: Build Custom FFmpeg 22

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-ffmpeg-build
  cancel-in-progress: false
  # GitHub added queue:max before actionlint 1.7.12 learned the key.
  queue: max

env:
  BUILD_ROOT: C:\ffb
  OUT_ROOT: ${{ github.workspace }}\ffmpeg-output
  DIAG_ROOT: ${{ github.workspace }}\ffmpeg-diagnostics

jobs:
  build:
    name: Windows x64 static FFmpeg
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout workflow files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate PowerShell build scripts
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem "${{ github.workspace }}\.github\ffmpeg-build" -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            throw 'PowerShell syntax validation failed.'
          }

      - name: Apply checked-in validator correction
        shell: pwsh
        run: '& "${{ github.workspace }}\.github\ffmpeg-build\patch-validator.ps1"'

      - name: Prepare clean workspace
        shell: pwsh
        run: |
          Remove-Item -LiteralPath $env:BUILD_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:OUT_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:DIAG_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:BUILD_ROOT, $env:OUT_ROOT, $env:DIAG_ROOT | Out-Null

      - name: Build stable from fresh source with one thread
        id: stable
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';' | Where-Object { $_ -and $_.Trim() -ne '.' }) -join ';')
          & "${{ github.workspace }}\.github\ffmpeg-build\build.ps1" -Variant stable
          exit $LASTEXITCODE

      - name: Prepare stable checkpoint
        id: stable_package
        if: steps.stable.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            & "${{ github.workspace }}\.github\ffmpeg-build\package-success.ps1" -Variant stable
          } catch {
            $_ | Format-List * -Force | Out-File "$env:DIAG_ROOT\SUMMARY-package-stable.txt" -Encoding UTF8
            throw
          }

      - name: Upload stable checkpoint before master
        id: stable_checkpoint
        if: steps.stable.outcome == 'success' && steps.stable_package.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-stable-windows-x64-${{ github.run_id }}
          path: ffmpeg-output/stable/**
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Preserve compiled stable binaries after validation failure
        if: always() && (steps.stable.outcome != 'success' || steps.stable_package.outcome != 'success' || steps.stable_checkpoint.outcome != 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-stable-unverified-windows-x64-${{ github.run_id }}
          path: ffmpeg-output/stable/**
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0

      - name: Build master with one thread
        id: master
        if: steps.stable.outcome == 'success' && steps.stable_package.outcome == 'success' && steps.stable_checkpoint.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = (($env:PATH -split ';' | Where-Object { $_ -and $_.Trim() -ne '.' }) -join ';')
          & "${{ github.workspace }}\.github\ffmpeg-build\build.ps1" -Variant master -ReuseSuite
          exit $LASTEXITCODE

      - name: Prepare stable and master artifact
        id: final_package
        if: steps.stable.outcome == 'success' && steps.master.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          try {
            & "${{ github.workspace }}\.github\ffmpeg-build\package-success.ps1" -Variant all
          } catch {
            $_ | Format-List * -Force | Out-File "$env:DIAG_ROOT\SUMMARY-package-all.txt" -Encoding UTF8
            throw
          }

      - name: Upload stable and master directly
        id: final_upload
        if: steps.stable.outcome == 'success' && steps.master.outcome == 'success' && steps.final_package.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-custom-windows-x64-${{ github.run_id }}
          path: ffmpeg-output/**
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Preserve compiled master binaries after validation failure
        if: always() && steps.stable.outcome == 'success' && (steps.master.outcome != 'success' || steps.final_package.outcome != 'success' || steps.final_upload.outcome != 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-master-unverified-windows-x64-${{ github.run_id }}
          path: ffmpeg-output/master/**
          retention-days: 7
          if-no-files-found: ignore
          compression-level: 0

      - name: Collect direct diagnostics
        if: always() && !(steps.stable.outcome == 'success' && steps.stable_package.outcome == 'success' && steps.stable_checkpoint.outcome == 'success' && steps.master.outcome == 'success' && steps.final_package.outcome == 'success' && steps.final_upload.outcome == 'success')
        shell: pwsh
        run: '& "${{ github.workspace }}\.github\ffmpeg-build\package-diagnostics.ps1"'

      - name: Upload diagnostics without an inner ZIP
        if: always() && !(steps.stable.outcome == 'success' && steps.stable_package.outcome == 'success' && steps.stable_checkpoint.outcome == 'success' && steps.master.outcome == 'success' && steps.final_package.outcome == 'success' && steps.final_upload.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ffmpeg-build-diagnostics-${{ github.run_id }}
          path: ffmpeg-diagnostics/**
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Mark failed build as failed
        if: always() && !(steps.stable.outcome == 'success' && steps.stable_package.outcome == 'success' && steps.stable_checkpoint.outcome == 'success' && steps.master.outcome == 'success' && steps.final_package.outcome == 'success' && steps.final_upload.outcome == 'success')
        shell: pwsh
        run: throw 'The FFmpeg build, validation, packaging, or artifact checkpoint failed. Download diagnostics; any compiled stable or master binaries were uploaded separately when available.'
