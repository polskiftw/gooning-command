name: Build Custom FFmpeg 9
run-name: Build Custom FFmpeg 9

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_ROOT: C:\ffb
  OUT_ROOT: ${{ github.workspace }}\ffmpeg-output
  DIAG_ROOT: ${{ github.workspace }}\ffmpeg-diagnostics

jobs:
  build:
    name: Windows x64 static FFmpeg
    runs-on: windows-2025
    timeout-minutes: 360

    steps:
      - name: Checkout workflow files
        uses: actions/checkout@v4

      - name: Replace REST stable-tag lookup with Git
        shell: pwsh
        run: |
          $path = "${{ github.workspace }}\.github\ffmpeg-build\build.ps1"
          $content = [IO.File]::ReadAllText($path)
          $pattern = '(?s)function Resolve-LatestStableTag \{.*?\n\}'
          $replacement = "function Resolve-LatestStableTag {`n    Write-Stage 'Resolve latest stable FFmpeg tag with Git'`n    `$remoteTags = & git ls-remote --tags --refs https://github.com/FFmpeg/FFmpeg.git 2>&1`n    if (`$LASTEXITCODE -ne 0) { throw \"Unable to query FFmpeg tags with Git:``n`$(`$remoteTags | Out-String)\" }`n    `$stable = `$remoteTags | ForEach-Object { if (`$_ -match 'refs/tags/(n\d+\.\d+(?:\.\d+)?)$') { `$Matches[1] } } | Where-Object { `$_ } | Sort-Object { [version]((`$_.TrimStart('n')) -replace '^([0-9]+\.[0-9]+)$','`$1.0') } -Descending | Select-Object -First 1`n    if (-not `$stable) { throw 'Unable to resolve latest stable FFmpeg tag from Git.' }`n    return `$stable`n}"
          $updated = [regex]::Replace($content, $pattern, $replacement, 1)
          if ($updated -eq $content) { throw 'Stable-tag resolver replacement did not apply.' }
          if ($updated -match 'Invoke-RestMethod') { throw 'REST stable-tag lookup remains after replacement.' }
          [IO.File]::WriteAllText($path, $updated, [System.Text.UTF8Encoding]::new($false))

      - name: Validate PowerShell build scripts
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem "${{ github.workspace }}\.github\ffmpeg-build" -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            throw 'PowerShell syntax validation failed.'
          }

      - name: Prepare clean workspace
        shell: pwsh
        run: |
          Remove-Item -LiteralPath $env:BUILD_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:OUT_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $env:DIAG_ROOT -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $env:BUILD_ROOT, $env:OUT_ROOT, $env:DIAG_ROOT | Out-Null

      - name: Build stable from fresh source with one thread
        id: stable
        continue-on-error: true
        shell: pwsh
        run: |
          & "${{ github.workspace }}\.github\ffmpeg-build\build.ps1" -Variant stable
          exit $LASTEXITCODE

      - name: Prepare stable checkpoint
        if: steps.stable.outcome == 'success'
        shell: pwsh
        run: |
          & "${{ github.workspace }}\.github\ffmpeg-build\package-success.ps1" -Variant stable

      - name: Upload stable checkpoint before master
        if: steps.stable.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-stable-windows-x64-${{ github.run_id }}
          path: ffmpeg-output/stable/**
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Build master with one thread
        id: master
        if: steps.stable.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & "${{ github.workspace }}\.github\ffmpeg-build\build.ps1" -Variant master -ReuseSuite
          exit $LASTEXITCODE

      - name: Prepare stable and master artifact
        if: steps.stable.outcome == 'success' && steps.master.outcome == 'success'
        shell: pwsh
        run: |
          & "${{ github.workspace }}\.github\ffmpeg-build\package-success.ps1" -Variant all

      - name: Upload stable and master directly
        if: steps.stable.outcome == 'success' && steps.master.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-custom-windows-x64-${{ github.run_id }}
          path: ffmpeg-output/**
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Collect direct diagnostics
        if: always() && (steps.stable.outcome != 'success' || steps.master.outcome != 'success')
        shell: pwsh
        run: |
          & "${{ github.workspace }}\.github\ffmpeg-build\package-diagnostics.ps1"

      - name: Upload diagnostics without an inner ZIP
        if: always() && (steps.stable.outcome != 'success' || steps.master.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-build-diagnostics-${{ github.run_id }}
          path: ffmpeg-diagnostics/**
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: Mark failed build as failed
        if: always() && (steps.stable.outcome != 'success' || steps.master.outcome != 'success')
        shell: pwsh
        run: throw 'The FFmpeg build failed. Download the diagnostics artifact; any completed stable checkpoint remains available.'
