name: Build GParty Deduper 5

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - deduper-cache-foundation
    paths:
      - "deduper/**"
      - "tests/**"
      - ".github/workflows/build-deduper.yml"

permissions:
  contents: write

concurrency:
  group: gparty-deduper-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Set up official CPython
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deduper/requirements.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r deduper/requirements.txt

      - name: Run full deduper test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Assemble transparent portable runtime
        shell: pwsh
        run: |
          $package = "deduper/dist/GParty-Deduper-Windows-Transparent"
          $runtime = Join-Path $package "runtime"
          $app = Join-Path $package "app"

          Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtime, $app | Out-Null

          # Copy the normal official CPython installation supplied by actions/setup-python.
          Copy-Item -Path (Join-Path $env:pythonLocation "*") -Destination $runtime -Recurse -Force

          # Replace build-machine packages with only the runtime dependencies.
          $sitePackages = Join-Path $runtime "Lib/site-packages"
          Remove-Item $sitePackages -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sitePackages | Out-Null
          python -m pip install --no-compile --target $sitePackages -r deduper/requirements.txt

          Copy-Item -Path "deduper" -Destination (Join-Path $app "deduper") -Recurse -Force
          Remove-Item (Join-Path $app "deduper/dist") -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $app "deduper/build") -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $app -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Copy-Item "deduper/config.example.txt" "$package/config.example.txt"
          Copy-Item "LICENSE" "$package/LICENSE.txt"

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "GPARTY_APP_DIR=%~dp0"
          set "PYTHONPATH=%~dp0app"
          start "GParty Deduper" "%~dp0runtime\pythonw.exe" -m deduper.main
          endlocal
          '@ | Set-Content -Path "$package/START GPARTY DEDUPER.cmd" -Encoding ascii

          @'
          GParty Deduper — Transparent Portable Build

          Start the app with: START GPARTY DEDUPER.cmd

          This package contains a normal, visible CPython runtime, the visible deduper source code,
          and visible Python dependency folders. It does not contain a PyInstaller executable,
          UPX packing, a self-extracting archive, or frozen-contents.txt.

          Copy config.example.txt to config.txt and place your existing data folder beside the launcher.
          '@ | Set-Content -Path "$package/README.txt" -Encoding utf8

      - name: Validate transparent runtime
        shell: pwsh
        run: |
          $package = (Resolve-Path "deduper/dist/GParty-Deduper-Windows-Transparent").Path
          $runtimePython = Join-Path $package "runtime/python.exe"
          $runtimePythonw = Join-Path $package "runtime/pythonw.exe"
          $launcher = Join-Path $package "START GPARTY DEDUPER.cmd"

          foreach ($required in @($runtimePython, $runtimePythonw, $launcher)) {
            if (!(Test-Path $required)) { throw "Missing portable runtime file: $required" }
          }

          $env:GPARTY_APP_DIR = $package
          $env:PYTHONPATH = Join-Path $package "app"
          & $runtimePython -c "import tkinter, cv2, boto3, PIL, imagehash, numpy, pdqhash, scipy; import deduper.main, deduper.smart_app, deduper.focused_matcher, deduper.focused_recertification, deduper.incremental_recertification, deduper.database_migration, deduper.review_ui; print('Transparent portable imports OK')"
          if ($LASTEXITCODE -ne 0) { throw "Transparent runtime import validation failed." }

          $resolved = & $runtimePython -c "from deduper.config import app_directory; print(app_directory())"
          if ($resolved.TrimEnd('\') -ne $package.TrimEnd('\')) {
            throw "Portable app directory resolved incorrectly: $resolved"
          }

          if (Get-ChildItem $package -Recurse -Filter "GParty Deduper.exe" -ErrorAction SilentlyContinue) {
            throw "A PyInstaller-style custom executable unexpectedly exists in the transparent package."
          }
          if (Test-Path (Join-Path $package "frozen-contents.txt")) {
            throw "frozen-contents.txt must not exist in the transparent package."
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $package = "deduper/dist/GParty-Deduper-Windows-Transparent"
          $zip = "deduper/dist/GParty-Deduper-Windows-Transparent.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$package/*" -DestinationPath $zip
          if (!(Test-Path $zip)) { throw "Transparent portable ZIP was not created." }
          if ((Get-Item $zip).Length -lt 10MB) { throw "Transparent portable ZIP is unexpectedly small." }

      - name: Scan package with Microsoft Defender CLI
        shell: pwsh
        run: |
          $package = (Resolve-Path "deduper/dist/GParty-Deduper-Windows-Transparent").Path
          $zip = (Resolve-Path "deduper/dist/GParty-Deduper-Windows-Transparent.zip").Path
          $platformRoot = Join-Path $env:ProgramData "Microsoft/Windows Defender/Platform"
          $platform = Get-ChildItem $platformRoot -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (!$platform) { throw "Microsoft Defender platform directory was not found." }
          $scanner = Join-Path $platform.FullName "MpCmdRun.exe"
          if (!(Test-Path $scanner)) { throw "Microsoft Defender CLI was not found: $scanner" }

          foreach ($target in @($package, $zip)) {
            & $scanner -Scan -ScanType 3 -File $target -DisableRemediation
            if ($LASTEXITCODE -ne 0) {
              throw "Microsoft Defender CLI rejected or could not scan $target (exit code $LASTEXITCODE). Artifact upload blocked."
            }
          }

          Write-Host "Microsoft Defender CLI scans completed with no detections."

      - name: Upload transparent Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: GParty-Deduper-Windows-Transparent
          path: deduper/dist/GParty-Deduper-Windows-Transparent.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest transparent Windows ZIP
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "deduper/dist/GParty-Deduper-Windows-Transparent.zip"
          $mainSha = (git ls-remote origin refs/heads/main).Split("`t")[0]
          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host "A newer main commit exists. Skipping the rolling release."
            exit 0
          }

          gh release view windows-latest --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload windows-latest $zip --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit windows-latest --latest --title "Latest Transparent Windows Build" --notes "Normal CPython runtime and visible source; no PyInstaller or UPX." --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create windows-latest $zip --latest --target $env:GITHUB_SHA --title "Latest Transparent Windows Build" --notes "Normal CPython runtime and visible source; no PyInstaller or UPX." --repo $env:GITHUB_REPOSITORY
          }
