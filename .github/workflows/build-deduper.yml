name: Build GParty Deduper 3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - deduper-cache-foundation
    paths:
      - "deduper/**"
      - "tests/**"
      - ".github/workflows/build-deduper.yml"

permissions:
  contents: write

concurrency:
  group: gparty-deduper-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deduper/requirements-build.txt

      - name: Install deduper packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r deduper/requirements-build.txt

      - name: Run full deduper test suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify packaging imports
        shell: pwsh
        run: |
          python -c "import deduper.main, deduper.smart_app, deduper.focused_matcher, deduper.focused_recertification, deduper.incremental_recertification, deduper.database_migration, deduper.review_ui; print('Packaging imports OK')"

      - name: Build Windows application without UPX
        working-directory: deduper
        run: pyinstaller --clean --noconfirm "GPartyDeduper.spec"

      - name: Validate frozen application layout
        shell: pwsh
        run: |
          $app = "deduper/dist/GParty Deduper"
          $exe = Join-Path $app "GParty Deduper.exe"
          if (!(Test-Path $exe)) { throw "Missing frozen executable: $exe" }
          if ((Get-Item $exe).Length -lt 100KB) { throw "Frozen executable is unexpectedly small" }

          $requiredPatterns = @(
            "*python312*.dll",
            "*opencv*.dll",
            "*sqlite*.dll"
          )
          foreach ($pattern in $requiredPatterns) {
            $found = Get-ChildItem -Path $app -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue
            if (!$found) { throw "Missing required packaged dependency matching $pattern" }
          }

          pyinstaller --version
          $pyz = "deduper/build/GPartyDeduper/PYZ-00.pyz"
          if (!(Test-Path $pyz)) { throw "Missing PyInstaller module archive: $pyz" }
          python -m PyInstaller.utils.cliutils.archive_viewer -l $pyz | Out-File "deduper/dist/frozen-contents.txt"
          $contents = Get-Content "deduper/dist/frozen-contents.txt" -Raw
          foreach ($module in @(
            "deduper.smart_app",
            "deduper.focused_matcher",
            "deduper.focused_recertification",
            "deduper.incremental_recertification",
            "deduper.database_migration",
            "deduper.review_ui"
          )) {
            if ($contents -notmatch [regex]::Escape($module)) {
              throw "Frozen module archive is missing $module"
            }
          }

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $package = "deduper/dist/GParty-Deduper-Windows"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -Recurse "deduper/dist/GParty Deduper/*" $package
          Copy-Item "deduper/config.example.txt" "$package/config.example.txt"
          Copy-Item "LICENSE" "$package/LICENSE.txt"
          Copy-Item "deduper/dist/frozen-contents.txt" "$package/frozen-contents.txt"
          Compress-Archive -Path "$package/*" -DestinationPath "deduper/dist/GParty-Deduper-Windows.zip"

          if (!(Test-Path "deduper/dist/GParty-Deduper-Windows.zip")) {
            throw "Portable ZIP was not created"
          }
          if ((Get-Item "deduper/dist/GParty-Deduper-Windows.zip").Length -lt 1MB) {
            throw "Portable ZIP is unexpectedly small"
          }

      - name: Scan package with Microsoft Defender
        shell: pwsh
        run: |
          $package = (Resolve-Path "deduper/dist/GParty-Deduper-Windows").Path
          $zip = (Resolve-Path "deduper/dist/GParty-Deduper-Windows.zip").Path
          $before = @(Get-MpThreatDetection -ErrorAction SilentlyContinue | ForEach-Object ThreatID)

          try {
            Update-MpSignature -ErrorAction Continue
            Start-MpScan -ScanType CustomScan -ScanPath $package -ErrorAction Stop
            Start-MpScan -ScanType CustomScan -ScanPath $zip -ErrorAction Stop
          } catch {
            throw "Microsoft Defender scan could not be completed: $($_.Exception.Message)"
          }

          $after = @(Get-MpThreatDetection -ErrorAction SilentlyContinue)
          $newThreats = @($after | Where-Object { $_.ThreatID -notin $before })
          if ($newThreats.Count -gt 0) {
            $newThreats | Format-List * | Out-String | Write-Host
            throw "Microsoft Defender detected the packaged application. Artifact upload blocked."
          }

          Write-Host "Microsoft Defender scan completed with no new detections."

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: GParty-Deduper-Windows
          path: deduper/dist/GParty-Deduper-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Windows ZIP
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "deduper/dist/GParty-Deduper-Windows.zip"
          $mainSha = (git ls-remote origin refs/heads/main).Split("`t")[0]

          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host "A newer main commit exists. Skipping the rolling release."
            exit 0
          }

          gh release view windows-latest --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/windows-latest" `
              -f "sha=$env:GITHUB_SHA" `
              -F "force=true"
            gh release upload windows-latest $zip `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            gh release edit windows-latest `
              --latest `
              --title "Latest Windows Build" `
              --notes "Automatically built, tested, and scanned from the newest deduper code on main." `
              --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create windows-latest $zip `
              --latest `
              --target $env:GITHUB_SHA `
              --title "Latest Windows Build" `
              --notes "Automatically built, tested, and scanned from the newest deduper code on main." `
              --repo $env:GITHUB_REPOSITORY
          }
