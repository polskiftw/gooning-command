# IMPORTANT: Increment the trailing revision every time this workflow file changes.
name: Build GParty Tag Time 1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tagtime/**"
      - ".github/workflows/build-tag-time.yml"

permissions:
  contents: write

concurrency:
  group: gparty-tag-time-windows-build
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tagtime/requirements-build.txt

      - name: Install Tag Time packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r tagtime/requirements-build.txt

      - name: Run Tag Time tests
        run: python -m unittest discover -s tagtime/tests -v

      - name: Build Windows application
        working-directory: tagtime
        run: pyinstaller --clean --noconfirm "GPartyTagTime.spec"

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $package = "tagtime/dist/GParty-Tag-Time-Windows"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -Recurse "tagtime/dist/GParty Tag Time/*" $package
          Copy-Item "tagtime/config.example.txt" "$package/config.example.txt"
          Copy-Item "LICENSE" "$package/LICENSE.txt"
          Compress-Archive -Path "$package/*" -DestinationPath "tagtime/dist/GParty-Tag-Time-Windows.zip"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v6
        with:
          name: GParty-Tag-Time-Windows
          path: tagtime/dist/GParty-Tag-Time-Windows.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest Windows ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "tagtime/dist/GParty-Tag-Time-Windows.zip"
          $mainSha = (git ls-remote origin refs/heads/main).Split("`t")[0]

          if ($mainSha -ne $env:GITHUB_SHA) {
            Write-Host "A newer main commit exists. Skipping the rolling release."
            exit 0
          }

          gh release view tag-time-windows-latest --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh api `
              --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/tag-time-windows-latest" `
              -f "sha=$env:GITHUB_SHA" `
              -F "force=true"
            gh release upload tag-time-windows-latest $zip `
              --clobber `
              --repo $env:GITHUB_REPOSITORY
            gh release edit tag-time-windows-latest `
              --latest `
              --title "Latest GParty Tag Time Build" `
              --notes "Automatically built and tested from the newest Tag Time code on main." `
              --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create tag-time-windows-latest $zip `
              --latest `
              --target $env:GITHUB_SHA `
              --title "Latest GParty Tag Time Build" `
              --notes "Automatically built and tested from the newest Tag Time code on main." `
              --repo $env:GITHUB_REPOSITORY
          }
