name: Download cats to R2

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, deliberately away from the top of the hour.
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: read

concurrency:
  group: gooning-party-cat-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and downloader packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Remember GitHub runner public IP
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_IP="$(curl -4 --fail --silent --show-error --max-time 20 https://api.ipify.org)"
          echo "GitHub runner public IP before Tailscale: ${BEFORE_IP}"
          echo "BEFORE_TAILSCALE_IP=${BEFORE_IP}" >> "$GITHUB_ENV"

      - name: Restore tiny download history directly from R2
        env:
          APP_MODE: restore
          DATA_DIR: ${{ runner.temp }}/gooning-party-data
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python app.py

      - name: Join private Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Route downloads through the Flint 2
        shell: bash
        env:
          TS_EXIT_NODE_IP: ${{ secrets.TS_EXIT_NODE_IP }}
        run: |
          set -euo pipefail

          if [ -z "${TS_EXIT_NODE_IP:-}" ]; then
            echo "TS_EXIT_NODE_IP is missing."
            exit 1
          fi

          echo "Selecting the Flint 2 exit node..."
          sudo tailscale set --exit-node="${TS_EXIT_NODE_IP}" --exit-node-allow-lan-access=false

          echo "Waiting for the home route to become active..."
          HOME_IP=""
          for attempt in $(seq 1 12); do
            sleep 3
            HOME_IP="$(curl -4 --fail --silent --show-error --max-time 20 https://api.ipify.org || true)"
            if [ -n "$HOME_IP" ] && [ "$HOME_IP" != "$BEFORE_TAILSCALE_IP" ]; then
              break
            fi
            echo "Attempt ${attempt}: public IP has not changed to the home route yet."
          done

          echo "GitHub runner IP: ${BEFORE_TAILSCALE_IP}"
          echo "Home-routed IP: ${HOME_IP:-<none>}"
          tailscale status

          if [ -z "$HOME_IP" ] || [ "$HOME_IP" = "$BEFORE_TAILSCALE_IP" ]; then
            echo "Home exit-node routing did not become active. Refusing to contact Reddit."
            exit 1
          fi

          echo "HOME_EXIT_IP=${HOME_IP}" >> "$GITHUB_ENV"
          echo "Home routing is active. Reddit and media downloads will use the Flint 2."

      - name: Download all new media through the home IP
        env:
          APP_MODE: download
          DATA_DIR: ${{ runner.temp }}/gooning-party-data
          REDDIT_COOKIES_BASE64: ${{ secrets.REDDIT_COOKIES_BASE64 }}
        run: python app.py

      - name: Stop using the Flint 2 before R2 uploads
        shell: bash
        run: |
          set -euo pipefail

          echo "Clearing the exit node..."
          sudo tailscale set --exit-node=

          echo "Waiting for GitHub's direct public route to return..."
          DIRECT_IP=""
          for attempt in $(seq 1 12); do
            sleep 3
            DIRECT_IP="$(curl -4 --fail --silent --show-error --max-time 20 https://api.ipify.org || true)"
            if [ -n "$DIRECT_IP" ] && [ "$DIRECT_IP" = "$BEFORE_TAILSCALE_IP" ]; then
              break
            fi
            echo "Attempt ${attempt}: direct GitHub IP has not returned yet. Current IP: ${DIRECT_IP:-<none>}"
          done

          echo "Expected GitHub runner IP: ${BEFORE_TAILSCALE_IP}"
          echo "Current public IP: ${DIRECT_IP:-<none>}"

          if [ -z "$DIRECT_IP" ] || [ "$DIRECT_IP" != "$BEFORE_TAILSCALE_IP" ]; then
            echo "The direct GitHub route was not restored. Refusing to upload media to R2 through the home tunnel."
            exit 1
          fi

          echo "Direct GitHub routing is restored. R2 uploads will bypass the Flint 2."

      - name: Upload all downloaded media directly to R2
        env:
          APP_MODE: upload
          DATA_DIR: ${{ runner.temp }}/gooning-party-data
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python app.py
