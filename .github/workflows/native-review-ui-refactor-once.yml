name: Native Review UI Refactor Once

on:
  push:
    branches:
      - deduper-cache-foundation
    paths:
      - "tools/native_review_ui_refactor_once.py"
      - ".github/workflows/native-review-ui-refactor-once.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/native_review_ui_refactor_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/native-review-ui-refactor-once.yml tools/native_review_ui_refactor_once.py
          git add deduper/app.py deduper/main.py deduper/review_ui.py tests/test_native_review_ui_architecture.py
          git commit -m "Make review UI hardening native"
          git push origin HEAD:deduper-cache-foundation
