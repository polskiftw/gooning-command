name: Native Slider Refactor Once

on:
  push:
    branches:
      - deduper-cache-foundation
    paths:
      - "tools/native_slider_refactor_once.py"
      - ".github/workflows/native-slider-refactor-once.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/native_slider_refactor_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/native-slider-refactor-once.yml tools/native_slider_refactor_once.py deduper/certified_slider.py
          git add deduper/app.py deduper/fast_app.py deduper/main.py tests/test_native_slider_architecture.py
          git commit -m "Make certified slider lock native"
          git push origin HEAD:deduper-cache-foundation
