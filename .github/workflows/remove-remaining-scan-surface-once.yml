name: Remove Remaining Scan Surface Once

on:
  push:
    branches:
      - deduper-cache-foundation
    paths:
      - "tools/remove_remaining_scan_surface_once.py"
      - ".github/workflows/remove-remaining-scan-surface-once.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/remove_remaining_scan_surface_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-remaining-scan-surface-once.yml tools/remove_remaining_scan_surface_once.py
          git add deduper/app.py tests/test_automatic_certified_startup.py
          git commit -m "Remove remaining manual scan surface"
          git push origin HEAD:deduper-cache-foundation
