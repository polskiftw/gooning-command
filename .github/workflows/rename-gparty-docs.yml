name: One-time GParty documentation cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rename-gparty-docs.yml'

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace project and hardware-specific wording
        shell: python
        run: |
          from pathlib import Path

          path = Path("DGD.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "# Gooning Command — DGD Guide": "# GParty — DGD Guide",
              "Select the Flint 2 as the Tailscale exit node.": "Select a Tailscale-compatible home router or other home-network device as the exit node.",
              "Stop using the Flint 2 exit node.": "Stop using the home exit node.",
              "Select the Flint 2 exit node.": "Select the configured home exit node.",
              "Used while the Flint 2 exit node is active.": "Used while the configured home exit node is active.",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")

          remaining = text.lower().count("flint 2")
          if remaining:
              raise SystemExit(f"DGD.md still contains {remaining} Flint 2 mention(s)")

      - name: Commit the cleaned documentation
        run: |
          if git diff --quiet; then
            echo "No documentation changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DGD.md
          git commit -m "Rename documentation to GParty and generalize router requirements"
          git push
