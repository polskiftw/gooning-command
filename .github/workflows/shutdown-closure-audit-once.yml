name: Shutdown Closure Audit Once

on:
  push:
    branches:
      - deduper-cache-foundation
    paths:
      - "tools/shutdown_closure_audit_once.py"
      - ".github/workflows/shutdown-closure-audit-once.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/shutdown_closure_audit_once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/shutdown-closure-audit-once.yml tools/shutdown_closure_audit_once.py
          git add deduper/app.py tests/test_shutdown_closure_architecture.py
          git commit -m "Make shutdown cancellation-safe"
          git push origin HEAD:deduper-cache-foundation
