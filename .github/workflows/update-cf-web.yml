name: update-cf-web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build temporary Wrangler configuration
        shell: bash
        env:
          WORKER_NAME: ${{ secrets.CLOUDFLARE_WORKER_NAME }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          set -euo pipefail

          if [ -z "${WORKER_NAME:-}" ]; then
            echo "CLOUDFLARE_WORKER_NAME secret is missing."
            exit 1
          fi

          if [ -z "${R2_BUCKET_NAME:-}" ]; then
            echo "R2_BUCKET_NAME secret is missing."
            exit 1
          fi

          cat > "${RUNNER_TEMP}/wrangler.toml" <<EOF
          name = "${WORKER_NAME}"
          main = "${GITHUB_WORKSPACE}/worker/worker.js"
          compatibility_date = "2026-07-28"

          [limits]
          cpu_ms = 300_000

          [secrets]
          required = ["CONTACT_EMAIL"]

          [[r2_buckets]]
          binding = "MEDIA_BUCKET"
          bucket_name = "${R2_BUCKET_NAME}"
          EOF

      - name: Deploy existing Worker manually
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config "${RUNNER_TEMP}/wrangler.toml"
