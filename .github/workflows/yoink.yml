name: Yoink

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, deliberately away from the top of the hour.
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: read

concurrency:
  group: gooning-party-cat-download
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Apply private subreddit overrides when configured
        shell: bash
        env:
          REDDIT_SOURCE_1: ${{ secrets.REDDIT_SOURCE_1 }}
          REDDIT_SOURCE_2: ${{ secrets.REDDIT_SOURCE_2 }}
          REDDIT_SOURCE_3: ${{ secrets.REDDIT_SOURCE_3 }}
        run: |
          set -euo pipefail

          PRIVATE_SETTINGS="${RUNNER_TEMP}/gooning-party-private-settings.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          source_path = Path("settings.json")
          output_path = Path(os.environ["RUNNER_TEMP"]) / "gooning-party-private-settings.json"

          settings = json.loads(source_path.read_text(encoding="utf-8"))
          sources = list(settings.get("sources", []))

          def normalize_source(value: str) -> str:
              value = value.strip()
              if not value:
                  return ""
              if value.startswith(("https://", "http://")):
                  return value
              value = value.strip("/")
              if value.lower().startswith("r/"):
                  value = value[2:]
              return f"https://www.reddit.com/r/{value}/new/"

          override_count = 0
          for index in range(3):
              env_name = f"REDDIT_SOURCE_{index + 1}"
              override = normalize_source(os.getenv(env_name, ""))
              if not override:
                  continue
              while len(sources) <= index:
                  sources.append("")
              sources[index] = override
              override_count += 1

              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
                  env_file.write(f"MASKED_REDDIT_SOURCE_{index + 1}={override}\n")

          settings["sources"] = sources
          output_path.write_text(json.dumps(settings, indent=2) + "\n", encoding="utf-8")

          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"SETTINGS_PATH={output_path}\n")

          print(
              f"Prepared runtime settings with {override_count} private subreddit override(s); "
              "all remaining entries still use settings.json fallbacks."
          )
          PY

          for value in "${REDDIT_SOURCE_1:-}" "${REDDIT_SOURCE_2:-}" "${REDDIT_SOURCE_3:-}"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

          for name in MASKED_REDDIT_SOURCE_1 MASKED_REDDIT_SOURCE_2 MASKED_REDDIT_SOURCE_3; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and downloader packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Remember GitHub runner public IP
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_IP="$(curl -4 --fail --silent --show-error --max-time 20 https://api.ipify.org)"
          echo "::add-mask::${BEFORE_IP}"
          echo "BEFORE_TAILSCALE_IP=${BEFORE_IP}" >> "$GITHUB_ENV"
          echo "Recorded and masked the GitHub runner public IP."

      - name: Restore tiny download history directly from R2
        env:
          APP_MODE: restore
          DATA_DIR: ${{ runner.temp }}/gooning-party-data
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python app.py

      - name: Join private Tailscale network
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Route downloads through the Flint 2
        shell: bash
        env:
          TS_EXIT_NODE_IP: ${{ secrets.TS_EXIT_NODE_IP }}
        run: |
          set -euo pipefail

          if [ -z "${TS_EXIT_NODE_IP:-}" ]; then
            echo "TS_EXIT_NODE_IP is missing."
            exit 1
          fi

          echo "Selecting the Flint 2 exit node..."
          sudo tailscale set --exit-node="${TS_EXIT_NODE_IP}" --exit-node-allow-lan-access=false

          echo "Waiting for the home route to become active..."
          HOME_IP=""
          for attempt in $(seq 1 12); do
            sleep 3
            HOME_IP="$(curl -4 --fail --silent --show-error --max-time 20 https://api.ipify.org || true)"
            if [ -n "$HOME_IP" ]; then
              echo "::add-mask::${HOME_IP}"
            fi
            if [ -n "$HOME_IP" ] && [ "$HOME_IP" != "$BEFORE_TAILSCALE_IP" ]; then
              break
            fi
            echo "Attempt ${attempt}: public IP has not changed to the home route yet."
          done

          echo "Public route check completed; detected addresses remain masked."

          if [ -z "$HOME_IP" ] || [ "$HOME_IP" = "$BEFORE_TAILSCALE_IP" ]; then
            echo "Home exit-node routing did not become active. Refusing to contact Reddit."
            exit 1
          fi

          echo "HOME_EXIT_IP=${HOME_IP}" >> "$GITHUB_ENV"
          echo "Home routing is active. Reddit and media downloads will use the Flint 2."

      - name: Download all new media through the home IP
        env:
          APP_MODE: download
          DATA_DIR: ${{ runner.temp }}/gooning-party-data
          REDDIT_COOKIES_BASE64: ${{ secrets.REDDIT_COOKIES_BASE64 }}
        run: python app.py

      - name: Stop using the Flint 2 before R2 uploads
        shell: bash
        run: |
          set -euo pipefail

          echo "Clearing the exit node..."
          sudo tailscale set --exit-node=

          echo "Waiting for GitHub's direct public route to return..."
          DIRECT_IP=""
          for attempt in $(seq 1 12); do
            sleep 3
            DIRECT_IP="$(curl -4 --fail --silent --show-error --max-time 20 https://api.ipify.org || true)"
            if [ -n "$DIRECT_IP" ]; then
              echo "::add-mask::${DIRECT_IP}"
            fi
            if [ -n "$DIRECT_IP" ] && [ "$DIRECT_IP" = "$BEFORE_TAILSCALE_IP" ]; then
              break
            fi
            echo "Attempt ${attempt}: direct GitHub route has not returned yet."
          done

          echo "Direct-route check completed; detected addresses remain masked."

          if [ -z "$DIRECT_IP" ] || [ "$DIRECT_IP" != "$BEFORE_TAILSCALE_IP" ]; then
            echo "The direct GitHub route was not restored. Refusing to upload media to R2 through the home tunnel."
            exit 1
          fi

          echo "Direct GitHub routing is restored. R2 uploads will bypass the Flint 2."

      - name: Upload all downloaded media directly to R2
        env:
          APP_MODE: upload
          DATA_DIR: ${{ runner.temp }}/gooning-party-data
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python app.py
